[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bitrebuttal"
version = "0.2.0"
description = "Bit Rebuttal - resilient aria2c supervisor for huge unattended downloads"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Bit Rebuttal" }]
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pywebview>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bitrebuttal = "bitrebuttal.__main__:main"

[tool.setuptools]
packages = ["bitrebuttal"]

[tool.setuptools.package-data]
bitrebuttal = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
