name: release

on:
  push:
    tags:
      - 'v*'
  # Manual runs build + smoke the binaries without cutting a tag; the upload
  # step below is tag-gated so a dispatch run never touches a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      # One platform's failure must not cancel the other legs' builds.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            files: |
              dist/BitRebuttal-windows-x64.exe
              dist/BitRebuttal-cli-windows-x64.exe
          - os: macos-latest
            arch: arm64
            files: |
              dist/BitRebuttal-macos-arm64.zip
              dist/BitRebuttal-cli-macos-arm64
          - os: macos-13
            arch: x64
            files: |
              dist/BitRebuttal-macos-x64.zip
              dist/BitRebuttal-cli-macos-x64
          - os: ubuntu-22.04
            artifact: BitRebuttal-linux-x64
            files: dist/BitRebuttal-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install . pyinstaller

      # Vendor aria2c INTO the bundle so users install nothing themselves
      # (engine.resolve_aria2c prefers the bundled copy). Windows takes the
      # official aria2 release build, checksum-pinned.
      - name: Vendor aria2c (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -sSL -o aria2.zip https://github.com/aria2/aria2/releases/download/release-1.37.0/aria2-1.37.0-win-64bit-build1.zip
          echo "67d015301eef0b612191212d564c5bb0a14b5b9c4796b76454276a4d28d9b288 *aria2.zip" | sha256sum -c
          unzip -q aria2.zip
          cp aria2-1.37.0-win-64bit-build1/aria2c.exe vendor/
          vendor/aria2c.exe --version

      # macOS: brew's arch-correct binary with its dylibs made relocatable
      # (dylibbundler) and ad-hoc signed. brew aria2 is uninstalled again right
      # away so the smoke test below proves the BUNDLED copy stands alone.
      - name: Vendor aria2c (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::vendor(macOS) failed at line $LINENO: $BASH_COMMAND"' ERR
          brew install aria2
          mkdir -p vendor
          cp "$(brew --prefix)/bin/aria2c" vendor/aria2c
          chmod +w vendor/aria2c

          # Non-system (Homebrew/MacPorts-prefix) dylib references of a Mach-O.
          brew_deps() { otool -L "$1" | awk '$1 ~ /^\/(opt\/homebrew|usr\/local)\// {print $1}'; }

          # Copy the transitive brew dylibs next to aria2c (graph is tiny:
          # sqlite, openssl x2, libssh2, c-ares, libintl - 4 passes reach a
          # fixed point with room to spare).
          for _ in 1 2 3 4; do
            for f in vendor/*; do
              for dep in $(brew_deps "$f"); do
                base=$(basename "$dep")
                [ -e "vendor/$base" ] || { cp "$dep" "vendor/$base"; chmod +w "vendor/$base"; }
              done
            done
          done

          # Rewrite every brew reference to @executable_path (all files sit in
          # the same dir as the aria2c the app spawns) and ad-hoc re-sign -
          # editing load commands invalidates the arm64 signature.
          for f in vendor/*; do
            for dep in $(brew_deps "$f"); do
              install_name_tool -change "$dep" "@executable_path/$(basename "$dep")" "$f"
            done
            case "$f" in *.dylib) install_name_tool -id "@executable_path/$(basename "$f")" "$f" ;; esac
            codesign -f -s - "$f"
          done

          # Prove the vendored copy stands alone before it ships.
          brew uninstall aria2
          vendor/aria2c --version
          echo "::notice::vendored ok: $(vendor/aria2c --version | head -1); files: $(ls vendor/ | tr '\n' ' ')"

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm bitrebuttal.spec

      # Linux ships unbundled (console build, package-manager audience); the
      # smoke test still needs aria2c on PATH for Engine.start()'s preflight.
      - name: Install aria2 (Linux smoke-test dependency)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y aria2

      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -uo pipefail
          dist/BitRebuttal.app/Contents/MacOS/BitRebuttal serve --headless --port 7999 &
          srv=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7999/api/status -o status.json; then ok=1; break; fi
            sleep 1
          done
          kill "$srv" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "app binary never answered /api/status"; exit 1; fi
          grep -q '"backend"' status.json || { echo "unexpected /api/status body:"; cat status.json; exit 1; }
          grep -q '"aria2cVersion":"1' status.json || { echo "bundled aria2c not detected:"; cat status.json; exit 1; }
          ./dist/bitrebuttal-cli --version

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          # Windowed exe: no console, but it still runs and serves.
          dist/BitRebuttal.exe serve --headless --port 7999 &
          srv=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7999/api/status -o status.json; then ok=1; break; fi
            sleep 1
          done
          kill "$srv" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "app binary never answered /api/status"; exit 1; fi
          grep -q '"backend"' status.json || { echo "unexpected /api/status body:"; cat status.json; exit 1; }
          grep -q '"aria2cVersion":"1' status.json || { echo "bundled aria2c not detected:"; cat status.json; exit 1; }
          ./dist/bitrebuttal-cli.exe --version

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -uo pipefail
          dist/BitRebuttal serve --headless --port 7999 &
          srv=$!
          ok=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:7999/api/status -o status.json; then ok=1; break; fi
            sleep 1
          done
          kill "$srv" 2>/dev/null || true
          if [ "$ok" -ne 1 ]; then echo "app binary never answered /api/status"; exit 1; fi
          grep -q '"backend"' status.json || { echo "unexpected /api/status body:"; cat status.json; exit 1; }
          dist/BitRebuttal --version

      - name: Rename artifacts (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mv dist/BitRebuttal.exe "dist/BitRebuttal-windows-x64.exe"
          mv dist/bitrebuttal-cli.exe "dist/BitRebuttal-cli-windows-x64.exe"

      - name: Package artifacts (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ditto -c -k --keepParent dist/BitRebuttal.app "dist/BitRebuttal-macos-${{ matrix.arch }}.zip"
          mv dist/bitrebuttal-cli "dist/BitRebuttal-cli-macos-${{ matrix.arch }}"

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: mv dist/BitRebuttal "dist/${{ matrix.artifact }}"

      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
